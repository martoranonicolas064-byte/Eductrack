<!DOCTYPE html>
<html lang="es">
<head>  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EducTrack — Tareas y Gestión de Archivos</title>
  <script src="security.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-page: #120304;
      --red-bright: #ff3b3b;
      --red-header: #b01c1c;
      --red-mid: #8a1014;
      --red-dark: #54080a;
      --wine: #2a0507;
      --card-border: rgba(255, 69, 69, 0.28);
      --ink: #140203;
      --white: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.75);
      --green: #12b45a;
      --radius-lg: 20px;
      --radius-md: 10px;
      --font-main: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-page);
      background-image: 
        radial-gradient(ellipse at 50% 15%, rgba(176, 28, 28, 0.35) 0%, transparent 65%),
        radial-gradient(circle at 85% 85%, rgba(138, 16, 20, 0.2) 0%, transparent 60%);
      font-family: var(--font-main);
      color: var(--white);
      padding: 16px 12px;
    }

    /* Contenedor Adaptativo */
    .app {
      position: relative;
      width: 100%;
      max-width: 440px;
      min-height: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 26px;
      border: 2px solid var(--card-border);
      background: radial-gradient(ellipse at 50% 40%, var(--red-mid) 0%, var(--red-dark) 55%, var(--wine) 100%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(176, 28, 28, 0.25);
      transition: max-width 0.3s ease;
    }

    /* Header */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, #b01c1c, #8a1014);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      gap: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateX(-2px);
    }

    .header__title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .course-badge {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .course-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    /* Layout Interno */
    .tareas-body {
      padding: 20px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    /* Tarjetas de acciones rápidas */
    .actions {
      flex-shrink: 0;
    }

    .action-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--red-bright);
      color: var(--ink);
      border: 0;
      border-radius: var(--radius-lg);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .action-card:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .action-card:active { transform: scale(0.98); }
    .action-card svg { stroke: var(--ink); width: 32px; height: 32px; }

    /* Gestión de archivos */
    .manager {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 12px;
    }

    .manager__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .manager__title {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
    }
    .search svg { flex-shrink: 0; stroke: #fff; }
    .search input {
      width: 110px;
      background: transparent;
      border: 0;
      color: #fff;
      font: inherit;
      font-size: 0.8rem;
    }
    .search input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .search input:focus { outline: none; }

    /* Panel de lista de archivos */
    .file-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 320px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: rgba(30, 3, 5, 0.85);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .file-panel__bar {
      height: 8px;
      background: var(--red-bright);
    }

    .file-list {
      flex: 1;
      list-style: none;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: var(--radius-md);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .file-item:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .file-item__icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: var(--red-bright);
      color: var(--ink);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .file-item__info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      gap: 2px;
    }

    .file-item__name {
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item__meta {
      font-size: 0.72rem;
      color: var(--text-soft);
    }

    /* Modales */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .modal__overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 2, 3, 0.86);
      backdrop-filter: blur(6px);
    }

    .modal__dialog {
      position: relative;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #8a1014 0%, #3a0808 100%);
      border: 1.5px solid var(--red-bright);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      z-index: 1;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }

    .modal.is-open .modal__dialog {
      transform: scale(1);
    }

    .modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--red-header);
      border-bottom: 1px solid rgba(0, 0, 0, 0.25);
    }

    .modal__title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .modal__close {
      background: none;
      border: none;
      color: var(--white);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }

    .modal__form {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--white);
      font: inherit;
      font-size: 0.85rem;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--red-bright);
    }

    .file-drop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 2px dashed var(--red-bright);
      border-radius: 10px;
      background: rgba(255, 59, 59, 0.08);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .file-drop:hover { background: rgba(255, 59, 59, 0.18); }

    .modal__actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: 0;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .btn--primary {
      background: var(--red-bright);
      color: var(--ink);
    }
    .btn--secondary {
      background: rgba(255, 255, 255, 0.15);
      color: var(--white);
    }
    .btn--danger {
      background: #c1171e;
      color: #fff;
    }

    .detalle-body {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.88rem;
    }
    .detalle-fecha {
      display: inline-flex;
      padding: 5px 12px;
      background: rgba(255, 59, 59, 0.2);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      width: fit-content;
    }
    .detalle-desc {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .btn-descarga-item {
      background: rgba(255, 59, 59, 0.22);
      border: 1px solid rgba(255, 69, 69, 0.45);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-descarga-item:hover {
      background: var(--red-bright);
      color: #120304;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 59, 59, 0.4);
    }

    /* ==========================================================================
       BREAKPOINTS RESPONSIVOS: TABLET Y ESCRITORIO
       ========================================================================== */
    @media (min-width: 768px) {
      body { padding: 28px 20px; }
      .app {
        max-width: 1040px;
        border-radius: 30px;
      }
      .header { padding: 18px 28px; }
      .header__title { font-size: 1.8rem; }
      .tareas-body {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 28px;
        padding: 26px 28px 32px;
      }
      .search input { width: 180px; }
      .file-panel { min-height: 440px; }
    }
  </style>
</head>
<body>
  <main class="app">

    <!-- Header -->
    <header class="header">
      <a href="profe.html" class="back-btn" title="Volver al panel principal">
        <i class="fa-solid fa-arrow-left"></i> Panel
      </a>
      <h1 class="header__title">Tareas</h1>
      <div class="course-badge">
        <span class="dot"></span>
        <span id="labelCursoTareas">4B • Matemáticas</span>
      </div>
    </header>

    <!-- Layout Central -->
    <div class="tareas-body">
      <!-- Columna 1: Acción de Crear Tarea -->
      <section class="actions">
        <button class="action-card" id="btnNuevaTarea" type="button">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M28 5H12a4 4 0 0 0-4 4v30a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V17L28 5z"/>
            <path d="M28 5v12h12"/>
            <path d="M24 25v12M18 31h12"/>
          </svg>
          <span>Subir Nueva Tarea</span>
        </button>
      </section>

      <!-- Columna 2: Gestión de Archivos y Tareas -->
      <section class="manager">
        <div class="manager__top">
          <h2 class="manager__title">Gestión de Archivos y Tareas</h2>
          <label class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/>
            </svg>
            <input type="search" id="searchInput" placeholder="Buscar..." aria-label="Buscar tarea">
          </label>
        </div>

        <div class="file-panel">
          <div class="file-panel__bar"></div>
          <ul class="file-list" id="listaTareas">
            <!-- Tareas renderizadas dinámicamente -->
          </ul>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal: Subir Tarea -->
  <div class="modal" id="modalTarea" aria-hidden="true">
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <div class="modal__header">
        <h3 class="modal__title" id="modalTitulo">Subir Tarea Escolar</h3>
        <button type="button" class="modal__close" id="btnCerrarModal" aria-label="Cerrar">&times;</button>
      </div>

      <form id="formTarea" class="modal__form">
        <div class="form-group">
          <label for="tareaCursoSelect">Curso Destino</label>
          <select id="tareaCursoSelect" style="width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 14px; outline: none; margin-bottom: 6px;">
            <option value="todos">Todos mis cursos asignados</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tareaTitulo">Título de la Tarea</label>
          <input type="text" id="tareaTitulo" placeholder="Ej: Trabajo Práctico de Funciones" required>
        </div>

        <div class="form-group">
          <label for="tareaFecha">Fecha Límite / Entrega</label>
          <input type="date" id="tareaFecha" required>
        </div>

        <div class="form-group">
          <label for="tareaDesc">Descripción / Consigna</label>
          <textarea id="tareaDesc" rows="3" placeholder="Detalles de la tarea o consigna..."></textarea>
        </div>

        <div class="form-group">
          <label>Archivos Adjuntos</label>
          <label class="file-drop" for="tareaArchivos">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Seleccionar Archivos (PDF, Word)</span>
            <input type="file" id="tareaArchivos" multiple hidden>
          </label>
          <div id="fileSelectedName" style="font-size:0.75rem; color:var(--text-soft); margin-top:4px;"></div>
        </div>

        <div class="modal__actions">
          <button type="button" class="btn btn--secondary" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn btn--primary">Guardar Tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Detalle de Tarea -->
  <div class="modal" id="modalDetalle" aria-hidden="true">
    <div class="modal__overlay" id="modalDetalleOverlay"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="detalleTitulo">
      <div class="modal__header">
        <h3 class="modal__title" id="detalleTitulo">Detalle de la Tarea</h3>
        <button type="button" class="modal__close" id="btnCerrarDetalle" aria-label="Cerrar">&times;</button>
      </div>
      <div class="detalle-body">
        <p class="detalle-fecha" id="detalleFecha"><i class="fa-regular fa-calendar"></i> Entrega: 15 de Noviembre</p>
        <div class="detalle-desc" id="detalleDesc"></div>
        <div style="font-size:0.85rem; font-weight:700; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <span>Archivo adjunto: <strong id="detalleArchivoNombre" style="color:var(--coral);">guia_ejercicios.pdf</strong></span>
          <button type="button" class="btn-descarga-item" id="btnDescargarPDFDetalle" style="padding:6px 14px; font-size:12px;">
            <i class="fa-solid fa-file-arrow-down"></i> Descargar PDF
          </button>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--danger" id="btnEliminarTarea">Eliminar Tarea</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast de Notificación -->
  <div id="tareaToast" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #12b45a; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; gap: 10px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; opacity: 0; pointer-events: none;">
    <i class="fa-solid fa-circle-check" style="font-size: 18px;"></i>
    <span id="toastMsg">Tarea actualizada correctamente</span>
  </div>

  <script>
    // Contexto de Curso y Materia Activos
    const curso = sessionStorage.getItem('cursoActivo') || localStorage.getItem('cursoActivo') || '4B';
    const materia = sessionStorage.getItem('materiaActiva') || localStorage.getItem('materiaActiva') || 'Matemáticas';
    const STORAGE_KEY = `educTrack_tareas_${curso}_${materia}`;

    let tareas = [];
    let tareaSeleccionadaId = null;

    const modalTarea = document.getElementById('modalTarea');
    const modalDetalle = document.getElementById('modalDetalle');
    const listaTareas = document.getElementById('listaTareas');
    const searchInput = document.getElementById('searchInput');
    const toast = document.getElementById('tareaToast');
    const toastMsg = document.getElementById('toastMsg');

    function mostrarToast(mensaje) {
      if (!toast) return;
      toastMsg.textContent = mensaje;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(100px)';
      }, 2600);
    }

    async function cargarCursosDocente() {
      const select = document.getElementById('tareaCursoSelect');
      if (!select) return;
      const token = localStorage.getItem('token');
      if (!token) return;
      const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';
      try {
        const res = await fetch(`${API_BASE}/api/profesor/dashboard`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.ok && Array.isArray(data.cursos)) {
            select.innerHTML = '<option value="todos">Todos mis cursos asignados</option>';
            data.cursos.forEach(c => {
              const opt = document.createElement('option');
              opt.value = c.id_curso;
              opt.textContent = `${c.nombre} (${c.descripcion || 'Curso'})`;
              select.appendChild(opt);
            });
            const activoId = sessionStorage.getItem('cursoActivoId');
            if (activoId) select.value = activoId;
          }
        }
      } catch (e) {
        console.warn('[Tareas] Error al cargar cursos:', e);
      }
    }

    async function cargarTareas() {
      const token = localStorage.getItem('token');
      const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';
      if (token) {
        try {
          const res = await fetch(`${API_BASE}/api/profesor/recordatorios`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.ok && Array.isArray(data.recordatorios)) {
              tareas = data.recordatorios.map(r => ({
                id: r.id,
                titulo: r.titulo,
                fecha: r.fecha,
                desc: r.resumen || '',
                archivo: r.archivo || (r.estado === 'reunion' ? 'Reunión Virtual' : 'consigna.pdf'),
                archivoData: r.archivo_data || null,
                curso: r.curso,
                materia: r.materia
              }));
              guardarTareas();
              renderTareas();
              return;
            }
          }
        } catch (e) {
          console.warn('[Tareas] Error al cargar del backend:', e);
        }
      }

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            tareas = parsed;
          }
        }
      } catch (e) {
        console.warn('[Tareas] Error al cargar localStorage:', e);
      }
      renderTareas();
    }

    function guardarTareas() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tareas));
      } catch (e) {
        console.error('[Tareas] Error al guardar en localStorage:', e);
      }
    }

    function renderTareas(filterText = '') {
      listaTareas.innerHTML = '';
      const filtradas = tareas.filter(t => t.titulo.toLowerCase().includes(filterText.toLowerCase()));

      if (filtradas.length === 0) {
        listaTareas.innerHTML = '<li style="padding:24px 16px; text-align:center; color:rgba(255,255,255,0.6); font-size:0.88rem;"><i class="fa-regular fa-folder-open" style="font-size:1.8rem; color:rgba(255,59,59,0.5); display:block; margin-bottom:8px;"></i>No se encontraron tareas</li>';
        return;
      }

      filtradas.forEach(t => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.onclick = () => abrirDetalle(t);
        li.innerHTML = `
          <div class="file-item__icon"><i class="fa-solid fa-file-pdf"></i></div>
          <div class="file-item__info">
            <span class="file-item__name">${t.titulo}</span>
            <span class="file-item__meta">Entrega: ${t.fecha} &bull; ${t.archivo || 'Sin archivo'}</span>
          </div>
          <button type="button" class="btn-descarga-item" onclick="event.stopPropagation(); descargarPDFTareaPorId(${t.id})" title="Descargar PDF de esta tarea">
            <i class="fa-solid fa-download"></i> PDF
          </button>
        `;
        listaTareas.appendChild(li);
      });
    }

    function abrirDetalle(tarea) {
      tareaSeleccionadaId = tarea.id;
      document.getElementById('detalleTitulo').textContent = tarea.titulo;
      document.getElementById('detalleFecha').innerHTML = `<i class="fa-regular fa-calendar"></i> Entrega: ${tarea.fecha}`;
      document.getElementById('detalleDesc').textContent = tarea.desc || 'Sin descripción adicional.';
      document.getElementById('detalleArchivoNombre').textContent = tarea.archivo || 'consigna.pdf';
      modalDetalle.classList.add('is-open');
    }

    // ── Descarga de PDF de Tarea Institucional ──────────────────────────
    function descargarPDFTareaPorId(id) {
      const tarea = tareas.find(t => t.id === id);
      if (!tarea) return;
      descargarPDFTarea(tarea);
    }

    function descargarPDFTarea(tarea) {
      const nombreArchivo = (tarea.archivo && tarea.archivo.toLowerCase().endsWith('.pdf')) 
        ? tarea.archivo 
        : `${(tarea.titulo || 'Tarea').replace(/[^a-zA-Z0-9_-]/g, '_')}_${curso}.pdf`;

      // Si se subió un archivo real en base64
      if (tarea.archivoData && tarea.archivoData.startsWith('data:')) {
        const a = document.createElement('a');
        a.href = tarea.archivoData;
        a.download = nombreArchivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        mostrarToast(`Descargando ${nombreArchivo}`);
        return;
      }

      // Generar documento PDF institucional 100% válido
      const blob = generarPDFBlob({
        titulo: tarea.titulo || 'Tarea Escolar',
        curso: curso,
        materia: materia,
        fecha: tarea.fecha || 'Sin fecha',
        desc: tarea.desc || 'Sin consignas detalladas.',
        archivo: nombreArchivo
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombreArchivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);

      mostrarToast(`Descargando ${nombreArchivo}`);
    }

    // Generador de PDF estándar en formato binario
    function generarPDFBlob(datos) {
      const sanitizar = (s) => (s || '').replace(/[\r\n\t]/g, ' ').replace(/[\\()]/g, '');
      const tit = sanitizar(datos.titulo);
      const cur = sanitizar(datos.curso);
      const mat = sanitizar(datos.materia);
      const fec = sanitizar(datos.fecha);
      const arch = sanitizar(datos.archivo);
      const rawDesc = sanitizar(datos.desc);

      // Dividir descripción en líneas
      const palabras = rawDesc.split(' ');
      const descLineas = [];
      let lineaActual = '';
      palabras.forEach(p => {
        if ((lineaActual + ' ' + p).trim().length > 60) {
          descLineas.push(lineaActual.trim());
          lineaActual = p;
        } else {
          lineaActual += ' ' + p;
        }
      });
      if (lineaActual.trim()) descLineas.push(lineaActual.trim());

      let stream = `BT
/F1 18 Tf
50 730 Td
(EDUCTRACK - PLATAFORMA EDUCATIVA INSTITUCIONAL) Tj
0 -26 Td
/F1 13 Tf
(Materia: ${mat}   |   Curso: ${cur}) Tj
0 -20 Td
/F2 10 Tf
(Fecha limite de entrega: ${fec}) Tj
0 -16 Td
(Archivo de referencia adjunto: ${arch}) Tj
0 -28 Td
/F1 12 Tf
(TRABAJO PRACTICO / CONSIGNAS DE LA TAREA:) Tj
0 -18 Td
/F2 11 Tf
(${tit}) Tj
0 -24 Td
/F1 11 Tf
(Instrucciones para los alumnos:) Tj
/F2 10 Tf
`;

      let yOffset = -16;
      descLineas.forEach(l => {
        stream += `0 ${yOffset} Td\n(${l}) Tj\n`;
        yOffset = -14;
      });

      stream += `0 -45 Td
/F1 9 Tf
(---------------------------------------------------------------------------------------------------) Tj
0 -16 Td
/F2 8 Tf
(Documento oficial generado por EducTrack. Valido como consigna de cursada.) Tj
ET`;

      const streamBytes = new TextEncoder().encode(stream);
      const streamLen = streamBytes.length;

      const obj1 = "1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n";
      const obj2 = "2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n";
      const obj3 = "3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >> endobj\n";
      const obj4 = `4 0 obj << /Length ${streamLen} >>\nstream\n${stream}\nendstream\nendobj\n`;
      const obj5 = "5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >> endobj\n";
      const obj6 = "6 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n";

      const header = "%PDF-1.4\n";
      const body = obj1 + obj2 + obj3 + obj4 + obj5 + obj6;
      const fullText = header + body;
      const offset = new TextEncoder().encode(fullText).length;

      const xref = `xref
0 7
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000244 00000 n 
0000000300 00000 n 
0000000375 00000 n 
trailer << /Size 7 /Root 1 0 R >>
startxref
${offset}
%%EOF`;

      return new Blob([fullText + xref], { type: 'application/pdf' });
    }

    document.getElementById('btnDescargarPDFDetalle').onclick = () => {
      const tarea = tareas.find(t => t.id === tareaSeleccionadaId);
      if (tarea) descargarPDFTarea(tarea);
    };

    let archivoSubidoData = null;
    document.getElementById('tareaArchivos').onchange = (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        document.getElementById('fileSelectedName').textContent = 'Archivo seleccionado: ' + file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          archivoSubidoData = evt.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        archivoSubidoData = null;
      }
    };

    document.getElementById('btnNuevaTarea').onclick = () => {
      document.getElementById('formTarea').reset();
      document.getElementById('fileSelectedName').textContent = '';
      archivoSubidoData = null;
      modalTarea.classList.add('is-open');
    };

    document.getElementById('btnCerrarModal').onclick = () => modalTarea.classList.remove('is-open');
    document.getElementById('btnCancelarModal').onclick = () => modalTarea.classList.remove('is-open');
    document.getElementById('modalOverlay').onclick = () => modalTarea.classList.remove('is-open');

    document.getElementById('btnCerrarDetalle').onclick = () => modalDetalle.classList.remove('is-open');
    document.getElementById('modalDetalleOverlay').onclick = () => modalDetalle.classList.remove('is-open');

    document.getElementById('formTarea').onsubmit = async (e) => {
      e.preventDefault();
      const titulo = document.getElementById('tareaTitulo').value.trim();
      const fecha = document.getElementById('tareaFecha').value;
      const desc = document.getElementById('tareaDesc').value.trim();
      const selectCurso = document.getElementById('tareaCursoSelect');
      const cursoVal = selectCurso ? selectCurso.value : 'todos';
      const archivoInput = document.getElementById('tareaArchivos');
      const archivo = archivoInput.files.length > 0 ? archivoInput.files[0].name : 'consigna.pdf';

      const token = localStorage.getItem('token');
      const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';

      if (token) {
        try {
          const res = await fetch(`${API_BASE}/api/profesor/recordatorios`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              id_curso: cursoVal === 'todos' ? null : cursoVal,
              todos_los_cursos: cursoVal === 'todos',
              titulo,
              contenido: desc,
              fecha_limite: fecha,
              archivo,
              archivo_data: archivoSubidoData
            })
          });
          const data = await res.json();
          if (data.ok) {
            mostrarToast('¡Tarea y archivo PDF publicados en TiDB Cloud!');
            modalTarea.classList.remove('is-open');
            await cargarTareas();
            return;
          }
        } catch (err) {
          console.warn('[Tareas] Error al guardar en backend:', err);
        }
      }

      tareas.unshift({
        id: Date.now(),
        titulo,
        fecha,
        desc,
        archivo,
        archivoData: archivoSubidoData
      });

      guardarTareas();
      modalTarea.classList.remove('is-open');
      renderTareas();
      mostrarToast('¡Tarea guardada localmente!');
    };

    document.getElementById('btnEliminarTarea').onclick = async () => {
      if (confirm('¿Desea eliminar esta tarea?')) {
        const token = localStorage.getItem('token');
        const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';
        if (token && tareaSeleccionadaId) {
          try {
            await fetch(`${API_BASE}/api/profesor/recordatorios/${tareaSeleccionadaId}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
          } catch(e) {
            console.warn('Error al eliminar en backend:', e);
          }
        }
        tareas = tareas.filter(t => t.id !== tareaSeleccionadaId);
        guardarTareas();
        modalDetalle.classList.remove('is-open');
        renderTareas();
        mostrarToast('Tarea eliminada correctamente.');
      }
    };

    searchInput.oninput = (e) => {
      renderTareas(e.target.value);
    };

    // Inicializar etiqueta de curso
    const labelCurso = document.getElementById('labelCursoTareas');
    if (labelCurso) labelCurso.textContent = `${curso} • ${materia}`;

    (async () => {
      await cargarCursosDocente();
      await cargarTareas();
    })();
  </script>
</body>
</html>

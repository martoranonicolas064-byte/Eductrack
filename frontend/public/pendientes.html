<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EducTrack — Pendientes y Recordatorios</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=2.1">
  <style>
    /* Ajustes visuales complementarios específicos del módulo */
    .filter-bar .active-filter-badge {
      font-size: 0.72rem;
      background: rgba(255, 59, 59, 0.25);
      border: 1px solid var(--red-bright);
      padding: 3px 8px;
      border-radius: 8px;
      color: #fff;
    }
    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.88rem;
    }
    .empty-state i {
      font-size: 2.2rem;
      color: rgba(255, 59, 59, 0.5);
      margin-bottom: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Chasis Principal Responsive -->
  <main class="app">

    <!-- Header Adaptativo -->
    <header class="header">
      <a href="profe.html" class="back-btn" title="Volver al Panel Principal">
        <i class="fa-solid fa-arrow-left"></i> <span>Panel</span>
      </a>
      <h1 class="header__title">Pendientes</h1>
      <div class="course-badge" id="badgeCurso" title="Curso y Materia activa">
        <i class="fa-solid fa-graduation-cap"></i>
        <span id="labelCursoPendientes">4B • Matemáticas</span>
      </div>
    </header>

    <!-- Contenedor Responsive (Desktop en 2 columnas, Móvil apilado) -->
    <div class="desktop-layout">
      
      <!-- Columna 1 / Superior: Acción Rápida y Resumen -->
      <div class="desktop-sidebar">
        <section class="actions">
          <button class="action-card" id="crear_recordatorio" type="button" aria-label="Crear nuevo recordatorio">
            <svg class="action-card__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <line x1="12" y1="8" x2="12" y2="16" />
              <line x1="8" y1="12" x2="16" y2="12" />
            </svg>
            <span>Crear recordatorio</span>
          </button>
        </section>

        <!-- Píldora de estado en desktop (oculta en móvil para máxima fluidez) -->
        <div class="desktop-info-card">
          <p><strong style="color:#fff;"><i class="fa-solid fa-circle-info" style="color:var(--red-bright);"></i> Gestión de Clase</strong></p>
          <p style="margin-top:6px;">Registra resúmenes de clase, avisos de exámenes y tareas pendientes para los alumnos.</p>
        </div>
      </div>

      <!-- Columna 2 / Principal: Gestión de Archivos y Pendientes -->
      <section class="manager">
        <div class="manager__top">
          <h2 class="manager__title">Gestionar recordatorios</h2>
          <label class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" aria-hidden="true">
              <circle cx="10" cy="10" r="6.5" />
              <path d="M15 15l6 6" />
            </svg>
            <input type="search" id="inputBuscar" placeholder="Buscar..." aria-label="Buscar por título de tarea, recordatorio o archivo">
          </label>
        </div>

        <!-- Barra de filtro por fecha -->
        <div class="filter-bar">
          <label class="filter-date" title="Filtrar por fecha">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <input type="date" id="filtroFecha" aria-label="Filtrar por fecha">
          </label>
          <button type="button" class="btn-clear-filter" id="btnLimpiarFiltroFecha" title="Limpiar filtro de fecha">Todos</button>
        </div>

        <div class="file-panel">
          <div class="file-panel__bar"></div>
          <ul class="file-list" id="listaRecordatorios">
            <!-- Lista renderizada dinámicamente -->
          </ul>
        </div>
      </section>

    </div>

    <!-- Modal: Crear / Editar Recordatorio -->
    <div class="modal" id="modalRecordatorio" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <div class="modal__overlay" id="modalOverlay"></div>
      <div class="modal__dialog">
        <div class="modal__header">
          <h3 class="modal__title" id="modalTitulo">Crear recordatorio</h3>
          <button type="button" class="modal__close" id="btnCerrarModal" aria-label="Cerrar">&times;</button>
        </div>

        <form id="formRecordatorio" class="modal__form">
          <input type="hidden" id="recordatorioId">

          <div class="form-group">
            <label for="recordatorioCursoSelect">Enviar a alumnos de</label>
            <select id="recordatorioCursoSelect" style="width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 14px; outline: none; margin-bottom: 6px;">
              <option value="todos">Todos mis cursos</option>
            </select>
          </div>

          <div class="form-group">
            <label for="recordatorioTitulo">Título / Asunto</label>
            <input type="text" id="recordatorioTitulo" placeholder="Ej: Trabajo Práctico de Matemáticas" required>
          </div>

          <div class="form-group">
            <label for="recordatorioResumen">Resumen de la clase / Consigna</label>
            <textarea id="recordatorioResumen" rows="3" placeholder="Escribe aquí el resumen de la clase o instrucciones..." required></textarea>
          </div>

          <div class="form-group">
            <label for="recordatorioFecha">Fecha</label>
            <input type="date" id="recordatorioFecha" required>
          </div>

          <div class="form-group">
            <label for="recordatorioArchivo">Archivo adjunto (opcional)</label>
            <div style="display: flex; gap: 8px; align-items: stretch;">
              <input type="text" id="recordatorioArchivo" placeholder="Ej: guia_ejercicios.pdf" style="flex: 1;">
              <label class="btn btn--secondary btn--sm" style="margin: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap;" title="Adjuntar archivo local">
                <i class="fa-solid fa-paperclip"></i>
                <input type="file" id="recordatorioFileInput" style="display: none;">
              </label>
            </div>
          </div>

          <div class="modal__actions">
            <button type="button" class="btn btn--secondary" id="btnCancelarModal">Cancelar</button>
            <button type="submit" class="btn btn--primary" id="btnGuardarRecordatorio">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Detalle de Tarea / Recordatorio -->
    <div class="modal" id="modalDetalle" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="detalleTitulo">
      <div class="modal__overlay" id="modalDetalleOverlay"></div>
      <div class="modal__dialog">
        <div class="modal__header">
          <h3 class="modal__title" id="detalleTitulo">Detalle del recordatorio</h3>
          <button type="button" class="modal__close" id="btnCerrarDetalle" aria-label="Cerrar">&times;</button>
        </div>
        <div class="detalle-body">
          <p class="detalle-fecha" id="detalleFecha"><i class="fa-regular fa-calendar"></i> <span id="detalleFechaTexto"></span></p>
          <div class="detalle-desc" id="detalleDesc"></div>
          <div class="detalle-archivos" id="detalleArchivosContenedor">
            <strong>Archivos adjuntos:</strong>
            <ul id="detalleListaArchivos" class="detalle-archivos-list"></ul>
          </div>
        </div>
        <div class="modal__actions modal__actions--center">
          <button type="button" class="btn btn--secondary btn--sm" id="btnEditarRecordatorio">
            <i class="fa-solid fa-pen"></i> Editar
          </button>
          <button type="button" class="btn btn--danger btn--sm" id="btnEliminarTarea">
            <i class="fa-solid fa-trash"></i> Eliminar
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Lógica y Controladores -->
  <script src="logica.js"></script>
</body>
</html>

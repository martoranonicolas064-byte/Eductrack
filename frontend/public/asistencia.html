<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EducTrack — Registro de Asistencia</title>
    <script src="security.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-page: #120304;
            --red-900: #2a0507;
            --red-800: #54080a;
            --red-700: #8a1014;
            --red-600: #b01c1c;
            --red-500: #ff3b3b;
            --red-dim: rgba(255, 59, 59, 0.18);
            --card-border: rgba(255, 69, 69, 0.28);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.7);
            --green: #12b45a;
            --font-main: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            background-image: 
                radial-gradient(ellipse at 50% 15%, rgba(176, 28, 28, 0.35) 0%, transparent 65%),
                radial-gradient(circle at 85% 85%, rgba(138, 16, 20, 0.2) 0%, transparent 60%);
            font-family: var(--font-main);
            color: var(--text);
            padding: 16px 12px;
        }

        /* Contenedor Adaptativo */
        .app {
            width: 100%;
            max-width: 440px;
            min-height: auto;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--red-700) 0%, var(--red-800) 45%, var(--red-900) 100%);
            border-radius: 26px;
            border: 2px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(176, 28, 28, 0.25);
            overflow: hidden;
            position: relative;
            transition: max-width 0.3s ease;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: linear-gradient(180deg, #b01c1c, #8a1014);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            gap: 10px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.15s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateX(-2px);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .course-badge {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .course-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
        }

        /* Contenido Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 18px 24px;
        }

        /* Tarjeta del Calendario */
        .calendar-card {
            padding: 16px;
            border-radius: 20px;
            background: rgba(45, 5, 8, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .calendar-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-top-bar h2 {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .month-nav button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .month-nav button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }

        .calendar {
            padding: 12px 8px;
            border-radius: 16px;
            background: rgba(18, 1, 3, 0.85);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            justify-items: center;
        }

        .weekday {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--muted);
            padding-bottom: 6px;
        }

        .day {
            width: 100%;
            max-width: 36px;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            background: var(--red-500);
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
            user-select: none;
        }

        .day:hover {
            transform: scale(1.12);
            background: #ff5a5a;
        }

        .day.selected {
            outline: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .day.has-records {
            background: var(--green);
        }

        .day.has-records:hover {
            background: #17d96d;
        }

        .day.other {
            background: var(--red-dim);
            color: rgba(255, 255, 255, 0.35);
            box-shadow: none;
            cursor: default;
        }
        .day.other:hover {
            transform: none;
            background: var(--red-dim);
        }

        /* Tabla y Lista de Asistencia */
        .attendance {
            flex: 1;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(45, 5, 8, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .attendance-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--red-500);
            font-size: 0.85rem;
            font-weight: 800;
        }

        .attendance-list {
            flex: 1;
            list-style: none;
            overflow-y: auto;
            max-height: 340px;
        }

        .attendance-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.15s;
        }

        .attendance-list li:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .student-num {
            font-size: 0.8rem;
            color: var(--muted);
            min-width: 22px;
            font-weight: 700;
        }

        .student-name {
            font-weight: 700;
            color: var(--text);
        }

        /* Botones de Estado de Asistencia */
        .status-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: transform 0.12s, filter 0.15s;
            touch-action: manipulation;
        }

        .status-badge:hover {
            filter: brightness(1.15);
            transform: scale(1.05);
        }

        .status-badge:active {
            transform: scale(0.96);
        }

        .status--sin-asignar {
            background: rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.8);
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }

        .status--presente {
            background: #12b45a;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(18, 180, 90, 0.4);
        }

        .status--ausente {
            background: #c1171e;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(193, 23, 30, 0.4);
        }

        .status--tarde {
            background: #e09f18;
            color: #1a0505;
            box-shadow: 0 2px 8px rgba(224, 159, 24, 0.4);
        }

        .save-bar {
            padding: 12px 16px;
            background: rgba(18, 1, 3, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-save {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-save:hover {
            background: #15d169;
            transform: translateY(-1px);
        }

        /* ==========================================================================
           BREAKPOINTS RESPONSIVOS: TABLET Y ESCRITORIO
           ========================================================================== */
        @media (min-width: 768px) {
            body { padding: 28px 20px; }
            .app {
                max-width: 1040px;
                border-radius: 30px;
            }
            .header {
                padding: 18px 28px;
            }
            .header h1 { font-size: 1.8rem; }
            main {
                display: grid;
                grid-template-columns: 360px 1fr;
                gap: 24px;
                padding: 26px 28px;
                align-items: start;
            }
            .attendance-list {
                max-height: 480px;
            }
        }

        @media (min-width: 1025px) {
            main {
                grid-template-columns: 400px 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <header class="header">
            <a href="profe.html" class="back-btn" title="Volver al panel principal">
                <i class="fa-solid fa-arrow-left"></i> Panel
            </a>
            <h1>Asistencia</h1>
            <div class="course-badge" id="badgeCurso">
                <span class="dot"></span>
                <span id="labelCurso">4B • Matemáticas</span>
            </div>
        </header>

        <main>
            <!-- Columna 1: Calendario Dinámico -->
            <section class="calendar-card">
                <div class="calendar-top-bar">
                    <h2>Calendario</h2>
                    <div class="month-nav">
                        <button id="prevMonth" aria-label="Mes anterior">&lt;</button>
                        <span id="monthLabel">Noviembre 2026</span>
                        <button id="nextMonth" aria-label="Mes siguiente">&gt;</button>
                    </div>
                </div>
                <div class="calendar">
                    <div class="grid" id="calendar"></div>
                </div>
            </section>

            <!-- Columna 2: Lista de Asistencia de Alumnos -->
            <section class="attendance">
                <div class="attendance-head">
                    <span>Lista de Alumnos</span>
                    <span id="diaLabel">Día seleccionado: 3 Nov</span>
                </div>
                <ul class="attendance-list" id="list">
                    <!-- Inyectado dinámicamente -->
                </ul>
                <div class="save-bar">
                    <button type="button" class="btn-save" id="btnTodosPresentes" style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.28);">
                        <i class="fa-solid fa-check-double"></i> Todos Presentes
                    </button>
                    <button class="btn-save" id="btnGuardar">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Asistencia
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast de Notificación -->
    <div id="asistenciaToast" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #12b45a; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; gap: 10px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; opacity: 0; pointer-events: none;">
        <i class="fa-solid fa-circle-check" style="font-size: 18px;"></i>
        <span id="toastMsg">Asistencia guardada correctamente</span>
    </div>

    <script>
        const MESES = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const WEEKDAYS = ["DOM", "LUN", "MAR", "MIE", "JUE", "VIE", "SAB"];

        const TODAY = new Date();
        let currentYear = TODAY.getFullYear();
        let currentMonth = TODAY.getMonth();
        let diaActivo = TODAY.getDate();

        // Obtener contexto de curso y materia
        const cursoActivo = sessionStorage.getItem('cursoActivo') || localStorage.getItem('cursoActivo') || '4B';
        const materiaActiva = sessionStorage.getItem('materiaActiva') || localStorage.getItem('materiaActiva') || 'Matemáticas';
        const STORAGE_KEY = `educTrack_asistencia_${cursoActivo}_${materiaActiva}`;

        // Alumnos por defecto (se enriquecen con la API del backend si está disponible)
        let alumnosDB = [
            { id: 1, nombre: "Lucas Benítez" },
            { id: 2, nombre: "Martina Fernández" },
            { id: 3, nombre: "Santiago Gómez" },
            { id: 4, nombre: "Valentina López" },
            { id: 5, nombre: "Mateo Rodríguez" },
            { id: 6, nombre: "Agustín Morales" },
            { id: 7, nombre: "Camila Fernández" },
            { id: 8, nombre: "Sofía Pérez" }
        ];

        let asistenciaPorDia = {};

        function cargarAsistenciaGuardada() {
            try {
                const guardado = localStorage.getItem(STORAGE_KEY);
                if (guardado) {
                    asistenciaPorDia = JSON.parse(guardado);
                }
            } catch (e) {
                console.warn('[Asistencia] Error al cargar localStorage:', e);
                asistenciaPorDia = {};
            }
        }

        function guardarAsistenciaStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(asistenciaPorDia));
            } catch (e) {
                console.error('[Asistencia] Error al guardar en localStorage:', e);
            }
        }

        function keyDia(year, month, day) {
            return `${year}-${month}-${day}`;
        }

        function obtenerAsistenciaDia(year, month, day) {
            const k = keyDia(year, month, day);
            if (!asistenciaPorDia[k]) {
                asistenciaPorDia[k] = {};
                alumnosDB.forEach(a => { asistenciaPorDia[k][a.id] = "Sin asignar"; });
            }
            return asistenciaPorDia[k];
        }

        function obtenerClaseEstado(estado) {
            return `status--${estado.toLowerCase().replace(/\s+/g, "-")}`;
        }

        const cal = document.getElementById("calendar");
        const monthLabel = document.getElementById("monthLabel");
        const list = document.getElementById("list");
        const diaLabel = document.getElementById("diaLabel");
        const toast = document.getElementById("asistenciaToast");
        const toastMsg = document.getElementById("toastMsg");

        function mostrarToast(mensaje) {
            if (!toast) return;
            toastMsg.textContent = mensaje;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(100px)';
            }, 2600);
        }

        function renderCalendar(year, month) {
            monthLabel.textContent = `${MESES[month]} ${year}`;
            cal.innerHTML = "";

            WEEKDAYS.forEach(d => {
                cal.insertAdjacentHTML("beforeend", `<div class="weekday">${d}</div>`);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            for (let i = firstDay - 1; i >= 0; i--) {
                const d = prevMonthDays - i;
                cal.insertAdjacentHTML("beforeend", `<div class="day other">${d}</div>`);
            }

            for (let d = 1; d <= totalDays; d++) {
                const isToday = (
                    d === TODAY.getDate() &&
                    month === TODAY.getMonth() &&
                    year === TODAY.getFullYear()
                );
                const div = document.createElement("div");
                div.className = "day";
                div.dataset.day = d;
                div.textContent = d;
                if (isToday) div.classList.add("today-marker");
                cal.appendChild(div);
            }

            const remainder = (firstDay + totalDays) % 7;
            const extra = remainder ? 7 - remainder : 0;
            for (let d = 1; d <= extra; d++) {
                cal.insertAdjacentHTML("beforeend", `<div class="day other">${d}</div>`);
            }

            cal.querySelectorAll(".day:not(.other)").forEach(el => {
                const d = parseInt(el.dataset.day, 10);
                const k = keyDia(year, month, d);
                if (asistenciaPorDia[k]) {
                    const tieneModificado = Object.values(asistenciaPorDia[k]).some(e => e && e !== "Sin asignar");
                    if (tieneModificado) el.classList.add("has-records");
                }
            });

            let diaASeleccionar = cal.querySelector(`.day[data-day="${diaActivo}"]:not(.other)`);
            if (diaASeleccionar) {
                diaASeleccionar.classList.add("selected");
                renderizarAlumnos(diaActivo);
            }
        }

        function renderizarAlumnos(dia) {
            diaActivo = dia;
            if (diaLabel) diaLabel.textContent = `Día seleccionado: ${dia} de ${MESES[currentMonth]}`;

            const asistenciaDia = obtenerAsistenciaDia(currentYear, currentMonth, dia);
            list.innerHTML = "";

            alumnosDB.forEach((alumno, index) => {
                const estado = asistenciaDia[alumno.id] || "Sin asignar";
                const li = document.createElement("li");

                const infoDiv = document.createElement("div");
                infoDiv.className = "student-info";
                infoDiv.innerHTML = `
                    <span class="student-num">${index + 1}.</span>
                    <span class="student-name">${alumno.nombre}</span>
                `;

                const badge = document.createElement("button");
                badge.type = "button";
                badge.className = `status-badge ${obtenerClaseEstado(estado)}`;
                badge.textContent = estado;

                badge.addEventListener("click", () => {
                    const cur = asistenciaDia[alumno.id];
                    const nuevoEstado = cur === "Presente" ? "Ausente"
                                      : cur === "Ausente" ? "Tarde"
                                      : "Presente";
                    asistenciaDia[alumno.id] = nuevoEstado;
                    badge.className = `status-badge ${obtenerClaseEstado(nuevoEstado)}`;
                    badge.textContent = nuevoEstado;

                    const elementoDia = cal.querySelector(`.day[data-day="${diaActivo}"]:not(.other)`);
                    if (elementoDia) elementoDia.classList.add("has-records");
                    guardarAsistenciaStorage();
                });

                li.append(infoDiv, badge);
                list.appendChild(li);
            });
        }

        cal.addEventListener("click", e => {
            const el = e.target.closest(".day:not(.other)");
            if (!el) return;
            cal.querySelectorAll(".day.selected").forEach(n => n.classList.remove("selected"));
            el.classList.add("selected");
            renderizarAlumnos(parseInt(el.dataset.day, 10));
        });

        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });

        // Cargar alumnos reales desde el backend según el curso seleccionado
        async function sincronizarAlumnosBackend() {
            const labelCurso = document.getElementById('labelCurso');
            if (labelCurso) labelCurso.textContent = `${cursoActivo} • ${materiaActiva}`;

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const res = await fetch(`http://localhost:3000/api/profesor/alumnos/1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.ok && data.alumnos && data.alumnos.length > 0) {
                        alumnosDB = data.alumnos.map((a, i) => ({
                            id: a.id_alumno || i + 1,
                            nombre: `${a.nombre} ${a.apellido || ''}`.trim()
                        }));
                        renderizarAlumnos(diaActivo);
                    }
                }
            } catch (err) {
                console.log('[Asistencia] Usando lista local precargada.');
            }
        }

        // Marcar todos como presentes para el día seleccionado
        document.getElementById('btnTodosPresentes').addEventListener('click', () => {
            const asistenciaDia = obtenerAsistenciaDia(currentYear, currentMonth, diaActivo);
            alumnosDB.forEach(a => {
                asistenciaDia[a.id] = "Presente";
            });
            const elementoDia = cal.querySelector(`.day[data-day="${diaActivo}"]:not(.other)`);
            if (elementoDia) elementoDia.classList.add("has-records");
            renderizarAlumnos(diaActivo);
            guardarAsistenciaStorage();
            mostrarToast(`Todos marcados Presentes para el día ${diaActivo} de ${MESES[currentMonth]}`);
        });

        document.getElementById('btnGuardar').addEventListener('click', () => {
            guardarAsistenciaStorage();
            mostrarToast(`¡Asistencia guardada correctamente para el día ${diaActivo}!`);
        });

        cargarAsistenciaGuardada();
        sincronizarAlumnosBackend();
        renderCalendar(currentYear, currentMonth);
    </script>
</body>
</html>
